# Author: Jacques Murray
[project]
name = "config-migrator"
version = "1.0.0"
description = "CLI tool to migrate legacy config files (ESLint, Babel) to modern formats."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "rich>=14.2.0",
    "typer>=0.20.0",
]
